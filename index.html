<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF0E5" />

    <!-- Référencement -->
    <title>NOD Consulting : une maison créative, une seule main</title>
    <meta name="description" content="NOD fait exister les projets et ceux qui les portent. Stratégie, identité, contenu, site : un seul interlocuteur, du brief au lancement." />
    <meta name="author" content="NOD Consulting" />

    <!-- Aperçu de partage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOD Consulting" />
    <meta property="og:url" content="https://nod-consulting.com/" />
    <meta property="og:title" content="NOD Consulting : une maison créative, une seule main" />
    <meta property="og:description" content="NOD fait exister les projets et ceux qui les portent. Stratégie, identité, contenu, site : un seul interlocuteur, du brief au lancement." />
    <meta property="og:image" content="https://nod-consulting.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NOD fait exister les projets et ceux qui les portent." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nod-consulting.com/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nod-consulting.com/" />
    
    <!-- Image d'en-tête de la page demandée, téléchargée tout de suite -->
    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        var img = { '/': 'golden-hour-silhouette', '/la-maison': 'light-fold-warm', '/travail': 'texture-ink-orange', '/contact': 'gradient-fold-yellow' }[p];
        if (!img) return;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = '/img/' + img + '.webp'; l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>
    <!-- Polices principales chargées en priorité -->
    <link rel="preload" href="/fonts/spectral-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
